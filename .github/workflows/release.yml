name: Release

# Releasing works the same way as Arcadia's: change the version in the VERSION file, write what changed in
# RELEASE_NOTES.md, push to main. Every push to main tests and builds the app (download it from the run's Artifacts),
# and when there is no release for that version yet this publishes v<version> with the app and its checksum, which is
# what get.sh installs and Deckhand updates itself from. It can also be run by hand from the Actions tab, to only build.
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-22.04   # an older system, so the app runs on as many distributions as possible (as Arcadia's)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "VERSION must look like 1.2.3, not '$VERSION'"; exit 1; }
          [ -s RELEASE_NOTES.md ] || { echo "RELEASE_NOTES.md is empty: say what changed"; exit 1; }
          echo "RELEASE_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t . -v

      - name: Build the app
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --strip --name deckhand --paths . \
            --add-data deckhand/logos:deckhand/logos --add-data deckhand/fonts:deckhand/fonts --add-data VERSION:. \
            deckhand/__main__.py
          scripts/make_app_file.sh dist/deckhand deckhand-linux-x86_64
          sha256sum deckhand-linux-x86_64 > deckhand-linux-x86_64.sha256

      - name: Check the build starts and knows its version
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          OUT="$(./deckhand-linux-x86_64 --version)"
          echo "$OUT"
          [ "$OUT" = "Deckhand $RELEASE_VERSION" ] || { echo "expected Deckhand $RELEASE_VERSION"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: deckhand-linux-x86_64
          path: |
            deckhand-linux-x86_64
            deckhand-linux-x86_64.sha256

      - name: Already released?
        id: existing
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$RELEASE_VERSION is already released."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish the release
        if: github.event_name == 'push' && steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$RELEASE_VERSION" deckhand-linux-x86_64 deckhand-linux-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Deckhand $RELEASE_VERSION" --notes-file RELEASE_NOTES.md
