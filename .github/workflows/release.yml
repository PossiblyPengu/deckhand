name: Release

# A new version on main is released automatically: when bin/deckhand.json changes there (scripts/publish_bin.sh
# wrote a new build), this publishes GitHub release v<version> with that binary, its checksum and its notes.
# The release carries exactly the build get.sh installs and bin/deckhand.json describes, so every way of
# getting Deckhand agrees. It can also be run from the Actions tab (for the branch it's run on).
on:
  push:
    branches: [main]
    paths: [bin/deckhand.json]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version
        run: |
          VERSION="$(python -c 'import json; print(json.load(open("bin/deckhand.json"))["version"])')"
          CODE="$(python -c 'import deckhand; print(deckhand.__version__)')"
          [ "$VERSION" = "$CODE" ] || { echo "bin/ holds Deckhand $VERSION but the code is $CODE: run scripts/publish_bin.sh"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Already released?
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v$VERSION is already released."
            echo "released=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the binary
        if: steps.existing.outputs.released != 'true'
        run: |
          cd bin
          sha256sum -c deckhand-linux-x86_64.sha256
          SHA="$(python -c 'import json; print(json.load(open("deckhand.json"))["sha256"])')"
          grep -q "^$SHA " deckhand-linux-x86_64.sha256 || { echo "deckhand.json's checksum doesn't match the binary"; exit 1; }

      - name: Test
        if: steps.existing.outputs.released != 'true'
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
          python -m unittest discover -s tests -t . -v

      - name: Publish the release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -c 'import json; print(json.load(open("bin/deckhand.json")).get("notes", ""))' > notes.md
          gh release create "v$VERSION" bin/deckhand-linux-x86_64 bin/deckhand-linux-x86_64.sha256 \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Deckhand $VERSION" --notes-file notes.md
