name: Build and Release Onefile

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-linux-onefile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
          python -m unittest discover -s tests -t . -v

      - name: Build onefile binary
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name deckhand \
            --paths . \
            --add-data deckhand/logos:deckhand/logos \
            deckhand/__main__.py
          cp dist/deckhand deckhand-linux-x86_64
          chmod +x deckhand-linux-x86_64

      - name: Create checksums
        run: sha256sum deckhand-linux-x86_64 > deckhand-linux-x86_64.sha256

      # The notes scripts/publish_bin.sh wrote for this version: the in-app updater shows them.
      - name: Release notes
        run: |
          python - > notes.md <<'PY'
          import json, os
          info = json.load(open("bin/deckhand.json"))
          print(info.get("notes", "") if info.get("version") == os.environ["GITHUB_REF_NAME"].lstrip("v") else "")
          PY

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          files: |
            deckhand-linux-x86_64
            deckhand-linux-x86_64.sha256
