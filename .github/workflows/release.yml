name: Build and Release Onefile

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # release a branch's build from the Actions tab: the release makes its v<version> tag
    inputs:
      version:
        description: "Version to release, e.g. 4.2.0 (must be the one in deckhand/__init__.py)"
        required: true

permissions:
  contents: write

jobs:
  build-linux-onefile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Version
        env:
          WANTED: ${{ inputs.version || github.ref_name }}
        run: |
          VERSION="${WANTED#v}"
          HAVE="$(python -c 'import deckhand; print(deckhand.__version__)')"
          [ "$VERSION" = "$HAVE" ] || { echo "Asked to release $VERSION, but the code is Deckhand $HAVE"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Test
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
          python -m unittest discover -s tests -t . -v

      - name: Build onefile binary
        run: |
          python -m PyInstaller \
            --noconfirm \
            --clean \
            --onefile \
            --windowed \
            --name deckhand \
            --paths . \
            --add-data deckhand/logos:deckhand/logos \
            deckhand/__main__.py
          cp dist/deckhand deckhand-linux-x86_64
          chmod +x deckhand-linux-x86_64

      - name: Create checksums
        run: sha256sum deckhand-linux-x86_64 > deckhand-linux-x86_64.sha256

      # The notes scripts/publish_bin.sh wrote for this version: the in-app updater shows them.
      - name: Release notes
        run: |
          python - > notes.md <<'PY'
          import json, os
          info = json.load(open("bin/deckhand.json"))
          print(info.get("notes", "") if info.get("version") == os.environ["VERSION"] else "")
          PY

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: notes.md
          files: |
            deckhand-linux-x86_64
            deckhand-linux-x86_64.sha256
