name: CI

on:
  push:          # every branch but main, so work in progress is tested too (main is tested by release.yml)
    branches-ignore: [main]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # PyQt6 wheels link libEGL; ubuntu-latest minimal image does not include it.
      - name: Install Qt / EGL libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3

      - name: Tests (engine + headless UI), with coverage
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m pip install coverage
          python -m coverage run --source=deckhand -m unittest discover -s tests -t . -v

      - name: Coverage stays at 86 % or more
        run: python -m coverage report --fail-under=86 | tail -n 3

      # Lint reports, warnings only for now (they don't fail the run): flake8 for the Python, shellcheck for the
      # scripts people run (get.sh) and the build helpers.
      - name: Lint (warnings only)
        continue-on-error: true
        run: |
          python -m pip install flake8
          python -m flake8 --max-line-length 120 deckhand tests || true
          shellcheck get.sh scripts/*.sh deckhand/*.sh || true
